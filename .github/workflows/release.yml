name: Release

# A tag v<versionName> builds the signed APK and opens a draft release with it and its checksum.
# The draft is published by hand, after a look: nothing reaches users from a tag alone.
#
# Secrets: OPENSAB_KEYSTORE_BASE64 (the release keystore, base64), OPENSAB_KEYSTORE_PASSWORD,
# OPENSAB_KEY_ALIAS and OPENSAB_KEY_PASSWORD.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the tag names the app version
        run: |
          NAME=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$NAME" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match versionName $NAME in app/build.gradle.kts"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew unitTests

      - name: Decode the release key
        env:
          OPENSAB_KEYSTORE_BASE64: ${{ secrets.OPENSAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$OPENSAB_KEYSTORE_BASE64" ]; then
            echo "the OPENSAB_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          printf '%s' "$OPENSAB_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "OPENSAB_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble the signed release APK
        env:
          OPENSAB_KEYSTORE_PASSWORD: ${{ secrets.OPENSAB_KEYSTORE_PASSWORD }}
          OPENSAB_KEY_ALIAS: ${{ secrets.OPENSAB_KEY_ALIAS }}
          OPENSAB_KEY_PASSWORD: ${{ secrets.OPENSAB_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify the signature and write the checksum
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "no signed APK: the build produced $(ls app/build/outputs/apk/release/)"
            exit 1
          fi
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          OUT="opensab-$GITHUB_REF_NAME.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Open the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$OUT" "$OUT.sha256" \
            --draft --verify-tag --title "OpenSAB $GITHUB_REF_NAME" --generate-notes
