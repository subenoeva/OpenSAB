name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew unitTests

      - name: Count unit tests and guard minimum
        if: always()
        run: |
          SUMMARY=$(find . -path '*/build/test-results/*' -name '*.xml' -not -path './build-logic/*' -print0 \
            | xargs -0 grep -ho 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' 2>/dev/null \
            | awk -F'"' '{t+=$2;f+=$6;e+=$8} END {print t+0, f+0, e+0}')
          read -r TESTS FAILURES ERRORS <<< "$SUMMARY"
          echo "tests: $TESTS failures: $FAILURES errors: $ERRORS"
          THRESHOLD=2547
          if [ "$TESTS" -lt "$THRESHOLD" ]; then
            echo "suite shrank: $TESTS < $THRESHOLD"
            exit 1
          fi
          if [ "$FAILURES" -ne 0 ] || [ "$ERRORS" -ne 0 ]; then
            echo "test failures detected: failures=$FAILURES errors=$ERRORS"
            exit 1
          fi

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug
